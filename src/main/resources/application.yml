spring:
  application:
    name: blue-oj-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  task:
    execution:
      thread-name-prefix: blue-oj-async-
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 200
        keep-alive: 60s

server:
  address: 0.0.0.0
  port: 8121
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.blue.blueojbackend.controller

app:
  jwt:
    issuer: blue-oj
    audience: blue-oj-api
    access-token-ttl: 30m
    clock-skew: 30s
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://localhost:5173
      - http://localhost:3000

logging:
  level:
    root: info
    com.blue.blueojbackend: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{50} - %msg%n"
