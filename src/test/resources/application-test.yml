spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:blue_oj;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  data:
    redis:
      host: localhost
      port: 6379
      database: 15

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins:
      - http://localhost
